<!--PLANTILLA ESQUELETO BASE-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LUNARA+{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-container">
    <video loop autoplay muted playsinline 
           poster="{{ url_for('static', filename='fondo_poster.jpg') }}" 
           class="back-video">
        <source src="{{ url_for('static', filename='fondo.mp4') }}" type="video/mp4">
    </video>

<div class="capa"></div><!--cspits-->
<!--Contiene la barra de menu transparente arriba-->
<header class="header">
    <div class="container">
        <a href="{{ url_for('base') }}" class="logo-title" style="text-decoration: none;">
            LUNARA
        </a>
        <nav class="menu">
            <a href="/staff">Staff</a>
            <a href="/clientes">Clientes</a>
            <a href="/planes">Planes</a>
            <a href="/suscripciones">Suscripciones</a>
            <a href="/pagos">Pagos</a>
            <a href="/reporte">Reportes</a>
        </nav>
    </div>
</header>

  
    <main class="main-container"><!--contenedor de lo que se coloque enlos sig html-->
    {% with messages = get_flashed_messages(with_categories=true) %}<!--con mensajes??-->
      {% for category, message in messages %}<!--si si los va recorrer como en una lista-->
        <div class="flash-msg flash-{{ category }}">{{ message }}</div><!--y los va mostrar segun su categoria con un diseño ya puesto en el style.css-->
      {% endfor %}
    {% endwith %}

    {% block content %}
    {% endblock %}
</main>

    <footer class="footer">
        <p>BBYM+ &copy; 2026 - Todos los derechos reservados</p>
    </footer>

</body>
</html>
